name: ci

on:
  pull_request:
  push:

jobs:
  build:
    runs-on: ubuntu-latest-large
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744  # v3
      - uses: actions/setup-go@be3c94b385c4f180051c996d336f57a34c397495  # v3
        with:
          go-version: '1.20'
          cache: true
      - run: go build .
      - run: ./gotestsum -f testname
